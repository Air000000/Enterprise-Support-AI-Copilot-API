name: Tests

on:
  push:
    branches:
      - main
      - learn-rag
  pull_request:
    branches:
      - main
      - learn-rag

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DASHSCOPE_API_KEY: dummy_key_for_tests
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DASHSCOPE_MODEL: qwen3.5-plus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Run Ruff
        run: |
          ruff check .

      - name: Check synthetic offline refusal demo
        run: python -m scripts.demo_refusal_coverage

      - name: Run focused tests
        run: |
          pytest \
            tests/test_todos.py \
            tests/test_rag_api.py \
            tests/test_rag_service.py \
            tests/test_query_chroma.py \
            tests/test_hybrid_search.py \
            tests/test_document_models.py \
            tests/test_document_service.py \
            tests/test_document_api.py \
            tests/test_tickets.py \
            tests/test_agent_ops_service.py \
            tests/test_agent_ops_api.py \
            tests/test_ticket_agent_service.py \
            tests/test_agent_ticket_api.py \
            tests/test_agentops_smoke_api.py \
            tests/test_refusal_evidence_sufficiency.py \
            tests/test_refusal_development_policy.py \
            tests/test_refusal_structured_evidence.py \
            tests/test_refusal_citation_selection.py \
            tests/test_refusal_requirement_coverage.py \
            tests/test_refusal_coverage_citation_example.py \
            tests/test_refusal_question_scoped_coverage.py \
            tests/test_refusal_v5_3_preparation.py \
            tests/test_refusal_prospective_preparation.py \
            tests/test_refusal_prospective_annotation.py \
            tests/test_refusal_v5_3_runner.py \
            tests/test_refusal_v5_2_1_preparation.py \
            tests/test_refusal_v5_2_1_runner.py \
            tests/test_refusal_natural_diagnostic_preparation.py \
            tests/test_refusal_natural_diagnostic_runner.py \
            tests/test_refusal_v5_preparation.py \
            tests/test_refusal_v5_2_preparation.py \
            tests/test_refusal_v5_2_annotation.py \
            tests/test_refusal_v5_2_controls.py \
            tests/test_refusal_v5_2_control_runner.py \
            tests/test_refusal_v5_paired_runner.py \
            tests/test_refusal_v5_1_paired_runner.py \
            tests/test_refusal_development_probe.py \
            tests/test_refusal_phase_b_runner.py \
            tests/test_refusal_v2_ai_proxy_runner.py \
            tests/test_refusal_v3_ai_proxy.py \
            tests/test_refusal_v3_ai_proxy_runner.py

      - name: Install declared offline evaluation test dependencies
        run: pip install -r requirements.txt -r experiments/evals/requirements-eval.txt

      - name: Run complete offline test directory
        env:
          SQL_ECHO: "false"
          AUTH_DEMO_USERS_JSON: ""
          JWT_SECRET: offline-ci-test-only
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          ANONYMIZED_TELEMETRY: "False"
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          DEEPEVAL_UPDATE_WARNING_OPT_OUT: "YES"
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          NUMBA_NUM_THREADS: "1"
          RAG_HYBRID_SEARCH_ENABLED: "false"
          RAG_HYBRID_ASK_ENABLED: "false"
          OPENAI_API_KEY: offline-placeholder
        run: |
          python -B - <<'PY'
          import gc, ipaddress, os, sys, tempfile
          from pathlib import Path
          import pytest
          private_data = str((Path.cwd() / "data").resolve()).casefold() + os.sep
          def guard(event, args):
              if event == "open" and isinstance(args[0], (str, bytes, os.PathLike)):
                  target = str(Path(os.fsdecode(args[0])).resolve()).casefold()
                  if target.startswith(private_data):
                      raise RuntimeError("private project data forbidden in offline tests")
              if event in ("socket.connect", "socket.getaddrinfo"):
                  host = args[1][0] if event == "socket.connect" else args[0]
                  if host == "localhost":
                      return
                  try:
                      if ipaddress.ip_address(host).is_loopback:
                          return
                  except ValueError:
                      pass
                  raise RuntimeError("external network forbidden in offline tests")
          sys.addaudithook(guard)
          with tempfile.TemporaryDirectory(prefix="offline_ci_") as temp:
              os.environ["DATABASE_URL"] = "sqlite:///" + str(Path(temp) / "tests.db")
              try:
                  code = pytest.main(["-q", "--tb=short", "-p", "no:cacheprovider", "tests"])
              finally:
                  import database
                  database.engine.dispose()
                  gc.collect()
          raise SystemExit(code)
          PY
